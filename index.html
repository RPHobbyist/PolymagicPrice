      <h2>Frequently Asked Questions</h2>
      <div style="text-align:left;">
        <h3>How do I calculate 3D printing costs?</h3>
        <p>PolymagicPrice calculates costs using: Material Cost + Electricity Cost + Machine Depreciation + Labor Cost +
          Overhead. Upload a G-code file for auto-fill or enter values manually.</p>

        <h3>Is PolymagicPrice free to use?</h3>
        <p>Yes, 100% free and open-source under AGPLv3. Use in your browser, download the desktop app, or self-host. No
          fees, subscriptions, or paywalls.</p>

        <h3>What 3D printing technologies does PolymagicPrice support?</h3>
        <p>FDM (Fused Deposition Modeling) for filament printing and Resin-based printing including SLA
          (Stereolithography) and DLP (Digital Light Processing).</p>

        <h3>Can I upload G-code files to auto-calculate costs?</h3>
        <p>Yes. Drag and drop .gcode, .3mf, or .cxdlpv4 files. The parser extracts print time, filament weight, resin
          volume, printer model, and material type automatically.</p>

        <h3>Does PolymagicPrice work offline?</h3>
        <p>Yes. The desktop app works completely offline. All calculations are performed client-side with zero server
          dependency.</p>

        <h3>Is my data private and secure?</h3>
        <p>None of your data ever leaves your machine. No external trackers, cloud analytics, or telemetry. The desktop
          app uses hardware-backed encryption.</p>

        <h3>How much should I charge for 3D prints?</h3>
        <p>Total Price = (Material + Electricity + Machine Wear + Labor + Overhead) x (1 + Markup%). The Rule of 3 is a
          common starting point. Typical markup is 20-50%.</p>

        <h3>What is a good markup percentage for 3D printing?</h3>
        <p>Industry standard is 20-50%. Simple parts: 20-30%. Custom or artisan work: 40-50% or higher.</p>

        <h3>How do I account for failed prints in my pricing?</h3>
        <p>Add your failure rate (typically 5-15%) to production costs. Use the overhead percentage field in
          PolymagicPrice.</p>

        <h3>How do I calculate electricity costs for 3D printing?</h3>
        <p>Formula: (Printer Wattage / 1000) x Print Hours x Electricity Rate per kWh. Most FDM printers use 100-150W.
        </p>

        <h3>Is resin printing more expensive than FDM?</h3>
        <p>Yes. Filament costs $15-$50/kg, resin costs $35-$150+/liter, plus consumables like IPA, gloves, and FEP film.
        </p>

        <h3>How do I price 3D prints for Etsy?</h3>
        <p>Include Etsy's 6.5% transaction fee and payment processing. Divide target price by 0.90 to maintain margin
          after fees.</p>

        <h3>What file formats does PolymagicPrice support?</h3>
        <p>.gcode (Cura, PrusaSlicer, OrcaSlicer, BambuStudio), .3mf (3D Manufacturing Format), .cxdlpv4 (ChiTuBox resin
          format).</p>

        <h3>Can I connect my Bambu Lab printer?</h3>
        <p>Yes. Desktop version supports Bambu Lab integration for real-time monitoring, file sending, and the Polymagic
          Bridge slicer link.</p>

        <h3>How do I manage multiple printers and materials?</h3>
        <p>Register your fleet in Settings. Each printer has its own costs, wattage, and depreciation. The Capacity
          Planner forecasts across all machines.</p>

        <h3>Does PolymagicPrice support multiple currencies?</h3>
        <p>Yes, PolymagicPrice is built for global use. You can configure your local currency (USD, EUR, GBP, INR, etc.) in the settings, along with your local electricity rates and labor costs, ensuring accurate pricing regardless of your region.</p>
